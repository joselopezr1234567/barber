<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d76e"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <!-- Fondo oscuro con esquinas redondeadas -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <!-- Marco dorado sutil -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="10"/>
  <!-- "P" de ProAgenda en dorado -->
  <text x="216" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="340" font-weight="bold" text-anchor="middle" fill="url(#gold)">P</text>
  <!-- Check de cita confirmada -->
  <circle cx="372" cy="360" r="86" fill="url(#gold)"/>
  <path d="M330 360 l30 30 l56 -62" fill="none" stroke="#09090b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
